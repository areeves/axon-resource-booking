services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    working_dir: /workspaces/axon-resource-booking
    volumes:
      - .:/workspaces/axon-resource-booking:cached
      - maven-cache:/home/vscode/.m2
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/axon_resource_booking
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: axon_resource_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d axon_resource_booking"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  maven-cache:
  postgres-data:
