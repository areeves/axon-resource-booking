services:
  api:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sh ./scripts/dev-api.sh
    working_dir: /workspaces/axon-resource-booking
    ports:
      - "8080:8080"
    volumes:
      - .:/workspaces/axon-resource-booking:cached
      - maven-cache:/home/vscode/.m2
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/axon_resource_booking
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin
      APP_SAMPLE_DATA_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /workspace/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "80:5173"
    volumes:
      - ./frontend:/workspace/frontend:cached
      - frontend-node-modules:/workspace/frontend/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: axon_resource_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d axon_resource_booking"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  frontend-node-modules:
  maven-cache:
  postgres-data:
