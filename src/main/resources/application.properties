spring.application.name=axon-resource-booking
axon.axonserver.enabled=false
axon.serializer.general=jackson
axon.serializer.events=jackson
axon.eventhandling.processors.resource-projections.mode=tracking
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/axon_resource_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.prometheus.metrics.export.enabled=true
logging.level.org.axonframework=INFO
logging.level.org.springframework.security=INFO
